<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <style>
        /* CSS - Styling dan Penyesuaian Warna */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Menggunakan gambar yang Anda berikan sebagai latar belakang */
            background-image: url('image/1188141.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            /* Efek kaca (Glassmorphism) agar latar belakang tetap membaur */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #2c3e50; /* Biru gelap menyerupai bayangan gedung */
            margin-bottom: 20px;
            font-size: 28px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #b3c6e0;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            color: #2c3e50;
        }

        input[type="text"]:focus {
            border-color: #5b8ec1;
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s ease;
        }

        #addBtn {
            padding: 0 20px;
            background-color: #5b8ec1; /* Biru langit menyesuaikan awan dan langit */
            color: white;
            font-size: 16px;
        }

        #addBtn:hover {
            background-color: #4a7ab0;
        }

        ul {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        li {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .task-text {
            cursor: pointer;
            flex: 1;
            color: #333;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            background-color: transparent;
            color: #d9534f;
            font-size: 18px;
            padding: 5px;
        }

        .delete-btn:hover {
            color: #c9302c;
        }

        #resetBtn {
            width: 100%;
            padding: 12px;
            /* Ungu kebiruan menyesuaikan warna gedung sebelah kiri */
            background-color: #6a5acd; 
            color: white;
            font-size: 16px;
            margin-top: 10px;
        }

        #resetBtn:hover {
            background-color: #5848b0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My To Do List</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Tambahkan tugas baru...">
            <button id="addBtn">Tambah</button>
        </div>

        <ul id="taskList">
            <!-- Daftar tugas akan muncul di sini -->
        </ul>

        <!-- Tombol Reset -->
        <button id="resetBtn">Reset Semua Tugas</button>
    </div>

    <script>
        // JavaScript - Logika Aplikasi
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const resetBtn = document.getElementById('resetBtn');

        // Fungsi untuk menambahkan tugas baru
        function addTask() {
            const taskText = taskInput.value.trim();
            
            if (taskText !== "") {
                // Membuat elemen list baru
                const li = document.createElement('li');
                
                // Menambahkan struktur HTML ke dalam list
                li.innerHTML = `
                    <span class="task-text">${taskText}</span>
                    <button class="delete-btn">✖</button>
                `;
                
                // Event listener untuk menandai tugas selesai (coret)
                li.querySelector('.task-text').addEventListener('click', function() {
                    this.classList.toggle('completed');
                });
                
                // Event listener untuk menghapus satu tugas
                li.querySelector('.delete-btn').addEventListener('click', function() {
                    li.remove();
                });
                
                // Memasukkan list ke dalam ul
                taskList.appendChild(li);
                
                // Mengosongkan input field
                taskInput.value = "";
            } else {
                alert("Silakan masukkan tugas terlebih dahulu!");
            }
        }

        // Menambahkan tugas saat tombol "Tambah" diklik
        addBtn.addEventListener('click', addTask);

        // Menambahkan tugas saat menekan tombol "Enter" pada keyboard
        taskInput.addEventListener('keypress', function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

        // Logika untuk tombol Reset (Menghapus semua tugas)
        resetBtn.addEventListener('click', function() {
            if (taskList.children.length > 0) {
                const confirmReset = confirm("Apakah Anda yakin ingin mereset/menghapus semua tugas?");
                if (confirmReset) {
                    taskList.innerHTML = "";
                }
            } else {
                alert("Daftar tugas sudah kosong.");
            }
        });
    </script>

</body>
</html>
